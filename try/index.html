<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outing Payment Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1 id="title">Outing Payments with Classified</h1>
<div class="sub" id="sub">Weekly Sunday payment tracker</div>
<div class="note hide" id="note"></div>

<div class="stats">
  <div class="stat"><b id="sTotal">₱0</b><span>Total collected</span></div>
  <div class="stat"><b id="sTarget">₱0</b><span>Target</span></div>
  <div class="stat"><b id="sBal">₱0</b><span>Remaining</span></div>
  <div class="stat"><b id="sWk">₱0</b><span>This Sunday</span></div>
</div>
<div class="bar"><i id="pbar"></i></div>
<div style="height:14px"></div>

<div class="card">
  <div class="tabs" id="tabs"></div>
  <div class="wk"><b id="wkTitle"></b><span id="wkSum" style="color:var(--mut);font-size:.85rem"></span></div>
  <div id="list"></div>
  <div id="addBox" style="margin-top:10px;display:flex;gap:8px">
    <input id="newName" placeholder="Add member name" maxlength="40">
    <button class="btn" id="addBtn" style="white-space:nowrap">Add</button>
  </div>
</div>

<div class="card">
  <b>All Sundays overview</b>
  <div class="tblw" style="margin-top:8px"><table id="tbl"></table></div>
</div>

<div class="card" id="settings">
  <b>Outing settings</b>
  <div class="grid" style="margin-top:10px">
    <div><label>Outing name</label><input id="cName"></div>
    <div><label>Amount per Sunday (₱)</label><input id="cAmt" type="number" min="0"></div>
    <div><label>First Sunday</label><input id="cStart" type="date"></div>
    <div><label>Number of Sundays</label><input id="cWeeks" type="number" min="1" max="60"></div>
  </div>
  <button class="btn" id="saveCfg">Save settings</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
